# Publica la web en GitHub Pages y actualiza las carreras cada día.
#
# - Al subir cambios (push a main): publica la web tal cual.
# - Cada día a las 05:00 UTC, o a mano desde la pestaña "Actions": ejecuta el
#   scraper, guarda carreras.json en el repositorio y publica la web.

name: Actualizar carreras y publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # guardar carreras.json actualizado
  pages: write      # publicar en GitHub Pages
  id-token: write

# Nunca dos publicaciones a la vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Actualizar carreras (scraper)
        if: github.event_name != 'push'
        run: python -m scraper.ejecutar

      - name: Guardar carreras actualizadas en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carreras.json scraper/geocache.json scraper/detalles_cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las carreras"
          else
            git commit -m "Actualizar carreras $(date -u +%Y-%m-%d)"
            git push
          fi

      # El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso: un "toque"
      # diario lo mantiene activo. Si falla, no detiene la publicación de la web.
      - name: Mantener activo Supabase (cuentas de usuario)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST \
            "https://fndytkkukhmijrrikjyw.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_MKC7ayO7IWHaAqPMtzFOBw_TP0pCSdT" \
            -H "Content-Type: application/json" -d '{}'

      # Avisos al móvil: se envía a la función "avisos" de Supabase el carreras.json recién
      # generado; ella decide qué avisar a cada usuario. La clave está en los secretos del
      # repositorio (Settings → Secrets and variables → Actions → AVISOS_CLAVE).
      - name: Enviar avisos al móvil
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          AVISOS_CLAVE: ${{ secrets.AVISOS_CLAVE }}
        run: |
          if [ -z "$AVISOS_CLAVE" ]; then
            echo "Sin AVISOS_CLAVE: avisos no configurados"
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            "https://fndytkkukhmijrrikjyw.supabase.co/functions/v1/avisos" \
            -H "apikey: sb_publishable_MKC7ayO7IWHaAqPMtzFOBw_TP0pCSdT" \
            -H "x-avisos-clave: $AVISOS_CLAVE" \
            -H "Content-Type: application/json" \
            --data-binary @carreras.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
